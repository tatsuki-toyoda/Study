<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
   xmlns:th="http://www.thymeleaf.org">
<head
   th:replace="common/head :: head_fragment(title = 'ウォーターサーバー情報編集', scripts = ~{::script}, links = ~{::link})"></head>
<body>
   <div class="container">
       <h1>ウォーターサーバー情報編集</h1>

       <form th:action="@{/wts/update}" th:object="${wtsUpdateRequest}" th:method="post">
           <input type="hidden" th:field="*{id}" />

           <div>
               <div class="row mx-md-n5">
                   <div class="col-2 pt-3 border bg-light">サーバー名<span class="text-danger">※</span></div>
                   <div class="col py-2 border">
                       <input type="text" class="form-control" th:field="*{serverName}">
                   </div>
               </div>
               <div class="row mx-md-n5">
                   <div class="col-2 pt-3 border bg-light">メーカー<span class="text-danger">※</span></div>
                   <div class="col py-2 border">
                       <input type="text" class="form-control" th:field="*{maker}">
                   </div>
               </div>
               <div class="row mx-md-n5">
                   <div class="col-2 pt-3 border bg-light">値段<span class="text-danger">※</span></div>
                   <div class="col py-2 border">
                       <input type="number" class="form-control" th:field="*{price}">
					   
					   
                       
                       <div th:if="${#fields.hasErrors('price')}"
                            th:errors="*{price}"
                            class="text-danger"></div>
							
							
							
                   </div>
               </div>
           </div>

           <div class="text-center">
               <input type="submit" class="btn btn-primary" value="保存">
               <a th:href="@{/wts/{id}(id=*{id})}" class="btn btn-secondary">キャンセル</a>
           </div>
       </form>
   </div>
</body>
</html>
